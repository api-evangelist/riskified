openapi: 3.2.0
info:
  title: Chargeback Guarantee - Post Auth Automation Endpoints API
  description: '# Riskified API for Fraud Prevention and Risk Management


    This API allows merchants to submit orders for review, check order status, and manage the complete order lifecycle.'
  version: 1.0.0
  contact:
    name: Riskified Support
    url: http://apiref.riskified.com/
    email: support@riskified.com
  x-explorer-enabled: false
  x-conventions:
    dateTime: All date-time fields are RFC 3339 (ISO 8601).
servers:
- url: https://sandbox.riskified.com
  description: Sandbox environment for testing and integration
- url: https://wh.riskified.com
  description: Production environment for live transactions
tags:
- name: Automation Endpoints
  description: Operations for managing order lifecycle (cancel, refund, fulfill, chargeback)
paths:
  /api/cancel:
    post:
      summary: Cancellation
      description: 'Mark a previously submitted order as cancelled. If the order has not yet been reviewed, it is excluded from future review. If the order has already been reviewed and approved, canceling it will also trigger a full refund on any associated charges.


        This endpoint is used when an order is fully cancelled after submission.'
      operationId: cancel
      tags:
      - Automation Endpoints
      parameters:
      - $ref: '#/components/parameters/RiskifiedShopDomain'
      - $ref: '#/components/parameters/RiskifiedSignature'
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cancel_order_wrapper'
            examples:
              customer_cancel:
                summary: Customer requested cancellation
                value:
                  order:
                    id: order-cc-guest-123456
                    cancel_reason: Customer requested cancellation
                    cancelled_at: '2025-03-14T12:30:00.000Z'
              inventory_cancel:
                summary: Cancellation due to inventory issues
                value:
                  order:
                    id: order-pp-reg-789012
                    cancel_reason: Out of stock
                    cancelled_at: '2025-03-14T14:45:00.000Z'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancel_Response'
              examples:
                cancel_good_response_200:
                  value:
                    order:
                      id: checkout-cc-123456
                      status: cancelled
                      description: Excluded by Riskified (due to cancellation)
                      old_status: approved
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                cancel_bad_response_400:
                  value:
                    error:
                      message: JSON malformed - only UTF-8 well formatted JSON payload allowed (RFC 4627)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                cancel_unauthorized_response_401:
                  value:
                    error:
                      message: 'Failed verifying request: ''X-RISKIFIED-HMAC-SHA256'' header is either missing or incorrect'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                cancel_too_many_requests_response_429:
                  value:
                    error:
                      message: Too many update requests for this order. Please try again later.
        '500':
          description: Contact Riskified support
        '504':
          description: Temporary error, please retry
  /api/chargeback:
    post:
      summary: Chargeback
      description: 'Notifies Riskified that a chargeback has been submitted for a specific order.

        Note: Riskified offers fully automated chargeback gateway integrations for major gateways: Braintree, Stripe, Adyen, PayPal; this process automates end-to-end chargeback handling from chargeback reporting to the disputing process.

        Riskified stands behind its chargeback guarantee for all approved orders.'
      operationId: chargeback
      tags:
      - Automation Endpoints
      parameters:
      - $ref: '#/components/parameters/RiskifiedShopDomain'
      - $ref: '#/components/parameters/RiskifiedSignature'
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chargeback_order_wrapper'
            examples:
              chargeback_fulfillment_first_dispute_won:
                $ref: '#/components/examples/chargeback_fulfillment_first_dispute_won'
              chargeback_without_fulfill:
                $ref: '#/components/examples/chargeback_without_fulfill'
              chargeback_with_fulfill:
                $ref: '#/components/examples/chargeback_with_fulfill'
              chargeback_first_dispute_won:
                $ref: '#/components/examples/chargeback_first_dispute_won'
              chargeback_second_dispute_lost:
                $ref: '#/components/examples/chargeback_second_dispute_lost'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chargeback_response'
              examples:
                chargeback_good_response_200:
                  value:
                    order:
                      id: '123456'
                      status: chargeback
                      old_status: approved
                      description: Received by Riskified
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                refund_bad_response_400:
                  value:
                    error:
                      message: JSON malformed - only UTF-8 well formatted JSON payload allowed (RFC 4627)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                refund_unauthorized_response_401:
                  value:
                    error:
                      message: 'Failed verifying request: ''X-RISKIFIED-HMAC-SHA256'' header is either missing or incorrect'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                refund_too_many_requests_response_429:
                  value:
                    error:
                      message: Too many update requests for this order. Please try again later.
        '500':
          description: Contact Riskified support
        '504':
          description: Temporary error, please retry
  /api/decision:
    post:
      summary: Merchant Decision
      description: Notify Riskified of the final external status of an order. Use this call to update Riskified when the merchant’s or payment gateway’s final decision differs from Riskified’s recommendation — for example, if the order was declined, canceled, or successfully captured after review. This ensures Riskified maintains full visibility into the complete order lifecycle and can continuously improve decision accuracy.
      operationId: decision
      tags:
      - Automation Endpoints
      parameters:
      - $ref: '#/components/parameters/RiskifiedShopDomain'
      - $ref: '#/components/parameters/RiskifiedSignature'
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/decision_order_wrapper'
            examples:
              payment_approved:
                summary: Payment authorized and order confirmed
                value:
                  order:
                    id: '450789469'
                    decision:
                      external_status: approved
                      reason: transaction authorized and order confirmed
                      decided_at: '2013-04-23T13:36:50-04:00'
                      notes: ''
                      amount: 120
                      currency: USD
                    gateway: Adyen
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/decision_response'
              examples:
                decision_good_response_200:
                  value:
                    order:
                      id: '450789469'
                      status: approved
                      description: Reviewed and approved by Riskified
                      old_status: approved
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                decision_bad_response_400:
                  value:
                    error:
                      message: JSON malformed - only UTF-8 well formatted JSON payload allowed (RFC 4627)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                decision_unauthorized_response_401:
                  value:
                    error:
                      message: 'Failed verifying request: ''X-RISKIFIED-HMAC-SHA256'' header is either missing or incorrect'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                decision_too_many_requests_response_429:
                  value:
                    error:
                      message: Too many update requests for this order. Please try again later.
        '500':
          description: Contact Riskified support
        '504':
          description: Temporary error, please retry
  /api/fulfill:
    post:
      summary: Order Fulfillment
      description: This endpoint informs Riskified that fulfillment information has been generated for a specific order, encompassing both successful and unsuccessful attempts. It can be called multiple times if there are multiple shipments on a single order. This functionality is essential for the automated submission of chargebacks, AKA CGI, and creation compelling evidence documentation for chargeback disputes. In its absence, merchants are required to manually upload proof of delivery via the Control Center.
      operationId: fulfill
      tags:
      - Automation Endpoints
      parameters:
      - $ref: '#/components/parameters/RiskifiedShopDomain'
      - $ref: '#/components/parameters/RiskifiedSignature'
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/fulfillment_order_wrapper'
            examples:
              order:
                summary: Fulfillment
                value:
                  order:
                    id: '1234'
                    fulfillments:
                    - fulfillment_id: COC78FRQ7DR
                      created_at: '2020-06-15T11:00:00-05:00'
                      status: success
                      tracking_company: fedex
                      tracking_numbers: '5758262322'
                      tracking_urls: http://fedex.com/track?q=abc123
                      message: estimated delivery 2 days
                      receipt: 'authorization: 765656'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fulfill_response'
              examples:
                fulfill_good_response_200:
                  value:
                    order:
                      id: '3000067'
                      status: fulfilled
                      description: Received by Riskified
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                refund_bad_response_400:
                  value:
                    error:
                      message: JSON malformed - only UTF-8 well formatted JSON payload allowed (RFC 4627)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                refund_unauthorized_response_401:
                  value:
                    error:
                      message: 'Failed verifying request: ''X-RISKIFIED-HMAC-SHA256'' header is either missing or incorrect'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                refund_too_many_requests_response_429:
                  value:
                    error:
                      message: Too many update requests for this order. Please try again later.
        '500':
          description: Contact Riskified support
        '504':
          description: Temporary error, please retry
  /api/refund:
    post:
      summary: Partial Refund
      description: 'Mark a previously submitted order as refunded. This can be a full or partial refund.


        This endpoint is used when an order is refunded after submission.'
      operationId: refund
      tags:
      - Automation Endpoints
      parameters:
      - $ref: '#/components/parameters/RiskifiedShopDomain'
      - $ref: '#/components/parameters/RiskifiedSignature'
      - $ref: '#/components/parameters/ContentType'
      - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/refund_order_wrapper'
            examples:
              full_refund:
                summary: Full refund
                value:
                  order:
                    id: order-cc-guest-123456
                    refunds:
                    - refund_id: refund-123
                      refunded_at: '2025-03-15T10:30:00.000Z'
                      amount: 129.99
                      currency: USD
                      reason: Customer dissatisfaction
              partial_refund:
                summary: Partial refund for damaged item
                value:
                  order:
                    id: order-pp-reg-789012
                    refunds:
                    - refund_id: refund-456
                      refunded_at: '2025-03-15T11:30:00.000Z'
                      amount: 89.99
                      currency: USD
                      reason: Item damaged during shipping
                      sku: FTW-SPORT-SLV
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/refund_response'
              examples:
                refund_good_response_200:
                  value:
                    order:
                      id: checkout-cc-123456
                      status: approved
                      description: Reviewed and approved by Riskified
                      old_status: approved
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                refund_bad_response_400:
                  value:
                    error:
                      message: JSON malformed - only UTF-8 well formatted JSON payload allowed (RFC 4627)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                refund_unauthorized_response_401:
                  value:
                    error:
                      message: 'Failed verifying request: ''X-RISKIFIED-HMAC-SHA256'' header is either missing or incorrect'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
              examples:
                refund_too_many_requests_response_429:
                  value:
                    error:
                      message: Too many update requests for this order. Please try again later.
        '500':
          description: Contact Riskified support
        '504':
          description: Temporary error, please retry
components:
  schemas:
    kyc_details:
      type: object
      description: The details of Know Your Customer (KYC) checks for the customer. Each check corresponds to a new object in the array. If kyc_details[] is provided, objects should contain all required fields.
      properties:
        vendor_name:
          type: string
          description: The name of the provider who performed the KYC check.
        update_at:
          type: string
          format: date-time
          description: The date and time (ISO8601) when KYC was attempted by the vendor
        kyc_verified:
          type: boolean
          description: The result of the KYC attempt
        kyc_type:
          type: string
          enum:
          - strong
          - soft
          description: If the KYC check has multiple levels, the type should be provided here.
      required:
      - vendor_name
      - update_at
      - kyc_verified
      example:
        vendor_name: Socure
        update_at: '2025-11-19T16:00:00Z'
        kyc_verified: true
        kyc_type: soft
    crypto_line_item:
      type: object
      description: Represents a cryptocurrency transaction line item.
      properties:
        price:
          type: number
          format: float
          description: The amount spent (in order currency) on cryptocurrency or asset(s).
          example: 420
        quantity:
          type: integer
          enum:
          - 1
          description: Quantity must always be 1 for cryptocurrency transactions.
          example: 1
        title:
          type: string
          description: The abbreviation of the cryptocurrency in all caps.
          example: ETH
        product_id:
          type: string
          description: The full asset name of the cryptocurrency.
          maxLength: 256
          example: Ethereum
        product_type:
          type: string
          enum:
          - crypto
          description: Specifies that this line item represents a digital asset.
          example: crypto
        category:
          type: string
          description: "The type of cryptocurrency transaction. \n Use `checkout` if purchasing at a third party merchant using cryptocurrency."
          enum:
          - one_time_buy
          - one_time_sell
          - one_time_order
          - recurring_buy
          - recurring_sell
          - checkout
          - nft
          example: one_time_order
        brand:
          type: string
          description: The brand name of the item.
        requires_shipping:
          type: boolean
          enum:
          - false
          - true
          example: false
          description: States whether or not the item requires shipping. Should be set to False unless crypto is being sent to another customer as remittance.
        sku:
          type: string
          description: A unique identifier of the item in the fulfillment.
        condition:
          type: string
          description: Description of the physical condition of the item, mostly relevant for used items.
        seller:
          $ref: '#/components/schemas/seller'
          description: '**(Conditional Requirement)** Required for marketplace or guest/host accommodations. Details about the seller of the item, relevant for marketplace orders.'
        vendor:
          $ref: '#/components/schemas/vendor_line_item'
          description: '**(Conditional Requirement)** Required if there is a different affiliated partner for each product or line item.'
        sub_category:
          type: string
          description: The sub-category of the item. For event tickets, the sub-category of the event.
        delivered_at:
          type: string
          format: date-time
          description: The timestamp indicating when the cryptocurrency was delivered to the wallet.
          example: '2022-04-14T15:00:00+00:00'
        delivered_to:
          type: string
          description: '**(Conditional Requirement)** Required for mixed shipment orders. The delivery type must contain one of the following values

            shipping_address: The Order''s shipping address is the end user''s entered address.

            store_pickup: If the end user selects store pickup, the shipping address value should contain the store''s address.'
          enum:
          - shipping_address
          - store_pickup
        recipient:
          type: object
          description: Recipient information for the cryptocurrency transfer.
          $ref: '#/components/schemas/recipient_crypto'
        drop_point:
          type: string
          description: If the end user is handing the package at a drop-off point, the shipping address value should contain the drop off location address
        size:
          type: string
          description: The size of the item (e.g. shirt or shoe size)
        registry_type:
          type: string
          description: 'The registry type must contain one of the following values: wedding, baby, other'
          enum:
          - wedding
          - baby
          - other
        shipping_address_id:
          type: string
          description: '**(Conditional Requirement)** unique ID, is required in case of multiple shipping addresses.'
        sender_name:
          type: string
          description: The sender name.
        photo_uploaded:
          type: boolean
          description: Indicating whether a photo was uploaded.
        photo_url:
          type: string
          description: The photo url (if uploaded).
        message:
          type: string
          description: The card's message.
        display_name:
          type: string
          description: The display name.
        greeting_photo_url:
          type: string
          description: The greeting photo url (if exists).
        greeting_message:
          type: string
          description: The greeting message.
        card_type:
          type: string
          description: The card's type.
      required:
      - price
      - quantity
      - title
      - product_type
      - product_id
      - category
      - requires_shipping
      - recipient
      example:
        title: ETH
        quantity: 1
        price: 420
        category: one_time_order
        product_type: crypto
        product_id: Ethereum
        requires_shipping: false
        delivered_at: '2022-04-14T15:00:00+00:00'
        recipient:
          email: user@example.com
          crypto_wallet:
            address: '0xc0ffee254729296a45a3885639AC7E10F9d54979'
            network: ethereum
            type: primary
    fulfillment_order:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the order that completed fulfillment.
        fulfillments:
          type: array
          items:
            $ref: '#/components/schemas/fulfillment_details'
          description: A list of fulfillment attempts for the order.
      required:
      - id
      - fulfillments
    refund_response:
      type: object
      description: Refund Response
      properties:
        order:
          type: object
          properties:
            id:
              type: string
              description: "Unique ID of order being acted upon. \n\n Note: This value should be later reflected also as order.id on the subsequent calls"
              example: '53953819'
            status:
              type: string
              enum:
              - approved
              description: "Textual status describing the result of Riskified analysis. \n\n Always 'approve' for approved orders. Order is approved and guaranteed by Riskified"
            description:
              type: string
              description: Additional context on Riskified decision.
            old_status:
              type: string
              description: Old order status
          required:
          - id
          - status
          - description
          - old_status
    dispute_details:
      type: object
      properties:
        case_id:
          type: string
          description: Dispute identifier as defined by the issuer/gateway
        status:
          type: string
          enum:
          - won
          - lost
          - open
          - pending
          - expired
          - accepted
          description: "The current status of the dispute. Possible values: \n* `open` - dispute was created and is awaiting action; \n* `pending` - evidence was submitted and the dispute is under review; \n* `expired` - the response window passed without submission and the case is considered lost due to timeout; \n* `accepted` - the dispute was intentionally accepted and liability is acknowledged;\n* `won` - the dispute was resolved in the merchant's favor;\n* `lost` - the dispute was resolved against the merchant. \n\n Note: we expect an updated API call when the dispute status changes."
        disputed_at:
          type: string
          format: date-time
          description: When (ISO8601) was the dispute sent.
        expected_resolution_date:
          type: string
          format: date-time
          description: When (ISO8601) should we expect a decision from the issuer (60-75 days usually).
        dispute_type:
          type: string
          enum:
          - first_dispute
          - second_dispute
          - arbitrary_court
          description: 'Note: we expect an updated api call when the dispute type changes'
      required:
      - case_id
      - status
    fulfillment_details:
      type: object
      properties:
        fulfillment_id:
          type: string
          description: Unique identifier of this fulfillment attempt.
        created_at:
          type: string
          format: date-time
          description: When (ISO8601) the order was fulfilled.
        status:
          type: string
          enum:
          - success
          - cancelled
          - error
          - failure
          description: The fulfillment status.
        line_items:
          type: array
          description: A list of each line item in the attempted fulfillment.
          items:
            $ref: '#/components/schemas/line_item'
        tracking_company:
          type: string
          description: 'The name of the shipping company. Supported values include:


            - `usps` — USPS

            - `ups` — UPS

            - `fedex` — FedEx

            - `dhl_express` — DHL / DHL Express

            - `dhl_ecommerce` — DHL Global Mail / DHL eCommerce

            - `canada_post` — Canada Post


            If the company is not listed, provide the carrier name as a string.'
        tracking_numbers:
          type: string
          description: A list of shipping numbers, provided by the shipping company.
        tracking_urls:
          type: string
          description: The URLs to track the fulfillment.
        message:
          type: string
          description: Additional textual description regarding the fulfillment status.
        receipt:
          type: string
          description: Information about the receipt.
      required:
      - fulfillment_id
      - created_at
      - tracking_company
      - tracking_numbers
    crypto_wallet:
      type: object
      description: A crypto wallet associated with the customer account.
      properties:
        address:
          type: string
          description: The network-specific address of the wallet.
          example: '0xc0ffee254729296a45a3885639AC7E10F9d54979'
        network:
          type: string
          description: The name of the crypto network. Must be lowercase with underscores between words (e.g. "bitcoin", "binance_smart_chain", "bitcoin_cash", "ethereum").
          example: ethereum
        type:
          type: string
          description: The wallet type.
          enum:
          - primary
          - secondary
          - custodial
          - non_custodial
          - hardware
          - exchange
          example: exchange
      required:
      - address
      - network
    refund_order_wrapper:
      type: object
      properties:
        order:
          $ref: '#/components/schemas/refund'
      required:
      - order
    customer:
      type: object
      properties:
        email:
          type: string
          description: The customer's email address.
        verified_email:
          type: boolean
          description: Indicates whether the merchant verified the customer’s email.
        first_name:
          type: string
          description: The first name of the customer.
        last_name:
          type: string
          description: The first name of the customer.
        id:
          type: string
          description: '**(Conditional Requirement)** The customer’s unique ID in the merchant’s system.

            Required in the case of a registered customer.'
        created_at:
          type: string
          format: date-time
          description: The timestamp (ISO8601) of the initial registration of the customer's account in the merchant's systems.
        verified_email_at:
          type: string
          format: date-time
