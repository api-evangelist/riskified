      - decision
    non_chb_payment_details:
      title: Store credits and gift card payments
      type: object
      properties:
        payment_type:
          type: string
          enum:
          - gift_card
          - store_credit
          - rewards_points
          example: gift_card
          description: Indicates the type of payment.
      required:
