      - last_name
      - address1
      - country
      - country_code
      - phone
      - city
      - zip
      - province
      example:
        first_name: John
        last_name: Test
        address1: 123 Smart St
        country: United States
        country_code: US
        phone: '+143873984567290'
        city: Los Angeles
        zip: '90210'
        province: California
        address2: Apt 4B
        company: My Company
        additional_phone: '+14245551234'
        verified_phone: true
        province_code: CA
        latitude: 34.0522
        longitude: -118.2437
        id: addr_cust_01
