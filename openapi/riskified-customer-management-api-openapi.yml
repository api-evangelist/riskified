      - client_details
      - session_details
      - customer
    address:
      type: object
      properties:
        first_name:
          type: string
          description: The first name of the person associated with the address.
          example: John
        last_name:
          type: string
          description: The last name of the person associated with the address.
          example: Doe
        address1:
          type: string
          description: The street name of the address.
          example: 123 Main St
        country:
          type: string
          description: The name of the country address.
          example: United States
        country_code:
          type: string
          description: The 2 letter country code (ISO 3166-1 alpha-2) of the country address
          example: US
        phone:
          type: string
          description: The phone number at the address.
          example: '+1234567890'
        city:
          type: string
          description: The city of the address.
          example: New York
        zip:
          type: string
          description: The zip or postal code of the address.
          example: '10001'
        address2:
          type: string
          description: An optional additional field for the street address.
          example: Apt 4B
        company:
          type: string
          description: Required if the address is associated to a company. The company of the person associated with the address.
        additional_phone:
          type: string
          description: Additional phone number at the address.
        verified_phone:
          type: boolean
          description: Indicates whether the provided phone number was verified.
          example: true
        province:
          type: string
          description: The name of the state or province of the address.
          example: New York
        province_code:
          type: string
          description: The two-letter abbreviation of the state or province of the address.
          example: NY
        neighborhood:
          type: string
